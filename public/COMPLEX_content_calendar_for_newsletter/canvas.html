        showDropZones = false,
        generatedAt
      } = props;

      const start = useMemo(() => {
        const base = startDate ? toDate(startDate) : new Date();
        return startOfWeek(base, weekStart);
      }, [startDate, weekStart]);

      const days = useMemo(() => {
        const total = weeks * 7;
        return Array.from({ length: total }, (_, i) => addDays(start, i));
      }, [start, weeks]);

        const map = {};
        if (Array.isArray(items)) {

            const key = it.date;
            map[key] = map[key] || [];
            map[key].push(it);
          });
        }
        return map;
      }, [items]);

      const weekRows = useMemo(() => {
        const rows = [];
        for (let w = 0; w < weeks; w++) {
          rows.push(days.slice(w * 7, (w + 1) * 7));
        }
        return rows;
      }, [days, weeks]);

              {generatedAt ? `Generated ${formatDate(generatedAt)}` : null}

                  const isToday = showTodayHighlight && isSameDay(day, new Date());

                      <div className="flex items-center justify-between">

                  <div className="bg-white rounded ring-1 ring-gray-200 p-2">
                    <div className="text-[11px] text-gray-500">Backlog</div>
                    <div className="text-sm font-semibold text-gray-900">{summaries?.totalBacklog ?? '-'}</div>
                  </div>
                  <div className="bg-white rounded ring-1 ring-gray-200 p-2">
                    <div className="text-[11px] text-gray-500">Weeks</div>
                    <div className="text-sm font-semibold text-gray-900">{weeks ?? '-'}</div>
                  </div>
                </div>
                {Array.isArray(summaries?.byStatus) && summaries.byStatus.length ? (
                  <div className="grid grid-cols-2 gap-2">
                    {summaries.byStatus.map((s, i) => <StatusCount key={i} status={s.status} count={s.count} />)}
                  </div>
                ) : null}
              </div>
            </aside>
          </div>
        </section>
      );
    };

    // Component Registry
    const ComponentRegistry = {
      NewsletterPlannerBoard: NewsletterPlannerBoard,
      ScheduledIssue: ScheduledIssue,
      BacklogIdea: BacklogIdea,
      IssueStatusOption: IssueStatusOption,
      StatusCount: StatusCount,
      CalendarGrid: CalendarGrid,
      IssueItem: IssueItem,
      BacklogItem: BacklogItem,
      BacklogList: BacklogList,
      IssueCard: IssueCard,
      IssueDetails: IssueDetails,
      StatusOption: StatusOption,
      IssueEditorModal: IssueEditorModal,
      StatusChip: StatusChip
    };

    const ComponentRenderer = ({ componentName, props }) => {
      const Component = ComponentRegistry[componentName];
      if (!Component) {
        return (
          <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p className="text-sm text-yellow-800">Component "{componentName}" not found</p>
          </div>
        );
      }
      return <Component {...props} />;
    };

    const ContentChunkRenderer = ({ chunk }) => {
      if (!chunk) return null;
      if (typeof chunk === 'string') {
        return <p className="text-sm text-gray-800 whitespace-pre-wrap">{chunk}</p>;
      }
      if (chunk.type === 'text') {
        return <p className="text-sm text-gray-800 whitespace-pre-wrap">{chunk.text || ''}</p>;
      }
      if (chunk.type === 'component') {
        const { component } = chunk;
        const name = component?.name;
        const props = component?.props || {};
        return (
          <div className="my-3">
            <ComponentRenderer componentName={name} props={props} />
          </div>
        );
      }
      return <pre className="text-xs text-gray-600 bg-gray-50 p-2 rounded">{JSON.stringify(chunk, null, 2)}</pre>;
    };

    const MessageBubble = ({ role, content }) => {
      const isUser = role === 'user';
      return (
        <div className={classNames("w-full", "py-4")}>
          <div className={classNames("max-w-4xl mx-auto", isUser ? "pl-2 pr-6" : "pl-6 pr-2")}>
            <div className={classNames("flex", isUser ? "justify-start" : "justify-start")}>
              <div className={classNames("w-full", "rounded-xl ring-1", isUser ? "bg-white ring-gray-200" : "bg-slate-50 ring-slate-200")}>
                <div className="px-4 py-2 border-b border-gray-100 flex items-center gap-2">
                  <span className={classNames("text-xs font-semibold", isUser ? "text-gray-700" : "text-indigo-700")}>
                    {isUser ? "User" : "Assistant"}
                  </span>
                </div>
                <div className="p-4 space-y-3">
                  {Array.isArray(content)
                    ? content.map((chunk, i) => <ContentChunkRenderer key={i} chunk={chunk} />)
                    : <ContentChunkRenderer chunk={content} />
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ConversationView = ({ conversation = [] }) => {
      return (
        <div className="min-h-screen">
          <header className="bg-white border-b border-gray-200">
            <div className="max-w-5xl mx-auto px-4 py-4">
              <h1 className="text-lg font-semibold text-gray-900">Conversation Viewer</h1>
              <p className="text-sm text-gray-600">Display-only UI component conversation</p>
            </div>
          </header>
          <main className="max-w-5xl mx-auto px-4 py-6">
            {Array.isArray(conversation) && conversation.length ? conversation.map((msg, idx) => (
              <MessageBubble key={idx} role={msg.role} content={msg.content} />
            )) : (
              <div className="text-sm text-gray-600">No conversation to display.</div>
            )}
          </main>
          <footer className="max-w-5xl mx-auto px-4 pb-8 text-[11px] text-gray-500">
            Built for static visualization. No interactive controls.
          </footer>
        </div>
      );
    };

    const rootEl = document.getElementById("root");
    if (rootEl) {
      const root = createRoot(rootEl);
      root.render(<ConversationView conversation={conversationData} />);
    }
  </script>
</body>
</html>
