    if (!value) return null;
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  };

  const dateKeyInTz = (date, tz) => {
    try {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: tz,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(date);
      const y = parts.find(p => p.type === 'year')?.value || '0000';
      const m = parts.find(p => p.type === 'month')?.value || '01';
      const d = parts.find(p => p.type === 'day')?.value || '01';
      return `${y}-${m}-${d}`;
    } catch (e) {
      const y = date.getUTCFullYear();
      const m = String(date.getUTCMonth() + 1).padStart(2, '0');
      const d = String(date.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
  };

  const formatShort = (date, tz) => {
    try {
      return new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'short', day: 'numeric' }).format(date);
    } catch (e) {
      return date.toDateString();
    }
  };

  const formatTime = (date, tz) => {
    try {
      return new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(date);
    } catch (e) {
      return '';
    }
  };

  const getISOWeek = (date) => {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() === 0 ? 7 : d.getUTCDay();
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return weekNo;
  };

  const start = parseDate(startDate) || new Date();

  const weeks = React.useMemo(() => {
    const days = [];
    const first = new Date(start.getTime());
    for (let i = 0; i < weekCount * 7; i += 1) {
      const d = new Date(first.getTime());
      d.setDate(first.getDate() + i);
      days.push(d);
    }
    const chunked = [];
    for (let w = 0; w < weekCount; w += 1) {
      chunked.push(days.slice(w * 7, w * 7 + 7));
    }
    return chunked;
  }, [startDate, weekCount]);

  const weekdayNames = React.useMemo(() => {
    const base = [];
    for (let i = 0; i < 7; i += 1) {
      const d = new Date(2021, 0, 3 + i);
      try {
        base.push(new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(d));
      } catch (e) {
        base.push(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]);
      }
    }
    return base;
  }, []);

  const issueDateKey = (issue, tz) => {
    const candidate = parseDate(issue?.date) || parseDate(issue?.scheduledDate) || parseDate(issue?.publishDate);
    return candidate ? dateKeyInTz(candidate, tz) : null;
  };

  const issuesByDay = React.useMemo(() => {
    const map = {};
    if (Array.isArray(issues)) {
      issues.forEach((it) => {
        const key = issueDateKey(it, safeTz);
        if (!key) return;
        if (!map[key]) map[key] = [];
        map[key].push(it);
      });
    }
    return map;
  }, [issues, safeTz]);

  const getStatusLabel = (status) => {
    if (!status) return '';
    const label = statusLegend[status];
    return typeof label === 'string' && label.length > 0 ? label : String(status);
  };

  const getStatusClasses = (status) => {
    const fallback = {
      planned: { bg: 'bg-blue-100', text: 'text-blue-700' },
      drafting: { bg: 'bg-yellow-100', text: 'text-yellow-800' },
      ready: { bg: 'bg-green-100', text: 'text-green-700' },
      sent: { bg: 'bg-green-100', text: 'text-green-700' },
      blocked: { bg: 'bg-red-100', text: 'text-red-700' },
      default: { bg: 'bg-gray-100', text: 'text-gray-700' }
    };
    const s = String(status || '').toLowerCase();
    const custom = statusColors[status];
    if (custom && typeof custom === 'object') {
      const bg = typeof custom.bg === 'string' ? custom.bg : '';
      const text = typeof custom.text === 'string' ? custom.text : '';
      return `${bg || fallback[s]?.bg || fallback.default.bg} ${text || fallback[s]?.text || fallback.default.text}`;
    }
    if (typeof custom === 'string') {
      return custom;
    }
    const f = fallback[s] || fallback.default;
    return `${f.bg} ${f.text}`;
  };

  const renderIssue = (issue, idx) => {
    const id = issue?.id || issue?._id || `i-${idx}`;
    const title = issue?.title || issue?.name || 'Untitled Issue';
    const status = issue?.status || issue?.state || '';
    const time = parseDate(issue?.date) || parseDate(issue?.scheduledDate) || parseDate(issue?.publishDate);
    const borderClass = (selectedIssueId && (String(selectedIssueId) === String(issue?.id) || String(selectedIssueId) === String(issue?._id)))
      ? 'border-blue-400'
      : 'border-gray-200';
    return (
      <div key={id} className={`p-2 bg-white rounded-md border ${borderClass} shadow-sm hover:shadow-md transition-shadow`}>
        <div className="flex items-start justify-between">
          <div className="flex-1 min-w-0">
            <div className="text-sm font-medium text-gray-900 truncate">{title}</div>
            {issue?.description && (
              <div className="text-xs text-gray-500 mt-0.5 line-clamp-2">{issue.description}</div>
            )}
          </div>
          {status ? (
            <span className={`ml-2 px-2 py-0.5 text-xs font-medium rounded ${getStatusClasses(status)}`}>
              {getStatusLabel(status)}
            </span>
          ) : null}
        </div>
        {(time || issue?.author || issue?.topic) ? (
          <div className="mt-1 text-xs text-gray-500 flex flex-wrap gap-x-3 gap-y-1">
            {time ? <span>{formatTime(time, safeTz)}</span> : null}
            {issue?.author ? <span>By {issue.author}</span> : null}
            {issue?.topic ? <span>Topic: {issue.topic}</span> : null}
          </div>
        ) : null}
      </div>
    );
  };

  return (
    <div className="w-full max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-6 border border-gray-200">
      <div className="flex items-center gap-3 mb-4">
        <img
          src={iconUrl || 'https://via.placeholder.com/64x64'}
          alt={boardTitle || 'Newsletter Calendar'}
          className="w-10 h-10 rounded-md object-cover"
          loading="lazy"
        />
        <div className="flex-1 min-w-0">
          <div className="text-lg font-semibold text-gray-900 truncate">{boardTitle || 'Newsletter Calendar'}</div>
          <div className="text-sm text-gray-600">
            {rangeLabel || 'Scheduled range'} • {safeTz}
          </div>
        </div>
      </div>

      {Object.keys(statusLegend || {}).length > 0 ? (
        <div className="mb-4">
          <div className="text-sm font-medium text-gray-700 mb-2">Status</div>
          <div className="flex flex-wrap gap-2">
            {Object.keys(statusLegend).map((key) => (
              <span key={key} className={`px-2 py-0.5 text-xs font-medium rounded ${getStatusClasses(key)}`}>
                {statusLegend[key]}
              </span>
            ))}
          </div>
        </div>
      ) : null}

      <div className="overflow-x-auto">
        <div className="min-w-[640px]">
          <div className="grid grid-cols-7 gap-2 mb-2">
            {weekdayNames.map((name, idx) => (
              <div key={idx} className="text-xs font-medium text-gray-600 uppercase tracking-wide">{name}</div>
            ))}
          </div>

          <div className="space-y-3">
            {weeks.map((week, wIdx) => (
              <div key={wIdx} className="border border-gray-200 rounded-lg">
                <div className="grid grid-cols-7 gap-0.5 p-1">
                  {week.map((day, dIdx) => {
                    const key = dateKeyInTz(day, safeTz);
                    const dayIssues = issuesByDay[key] || [];
                    return (
                      <div key={dIdx} className="bg-gray-50 rounded-md p-2 flex flex-col min-h-[120px]">
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-xs font-medium text-gray-700">{formatShort(day, safeTz)}</span>
                          <span className="text-[10px] text-gray-500">{dayIssues.length > 0 ? `${dayIssues.length}` : ''}</span>
                        </div>
                        <div className="space-y-2">
                          {dayIssues.length > 0 ? dayIssues.map((it, idx) => renderIssue(it, idx)) : (
                            <div className="text-xs text-gray-400 italic">No issues</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {showWeekNumbers ? (
                  <div className="px-3 py-2 border-t border-gray-200 bg-white rounded-b-lg text-xs text-gray-500">
                    Week {getISOWeek(week[0])}
                  </div>
                ) : null}
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="mt-6">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-lg font-semibold text-gray-900">Backlog Ideas</h3>
          <span className="text-sm text-gray-500">{Array.isArray(backlogIdeas) ? backlogIdeas.length : 0} items</span>
        </div>
        {Array.isArray(backlogIdeas) && backlogIdeas.length > 0 ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {backlogIdeas.map((idea, idx) => {
              const title = idea?.title || idea?.name || `Idea ${idx + 1}`;
              const desc = idea?.description || idea?.summary || '';
              const status = idea?.status || '';
              const topic = idea?.topic || idea?.category || '';
              return (
                <div key={idea?.id || idea?._id || `b-${idx}`} className="p-3 bg-gray-50 rounded-lg border border-gray-200 hover:shadow-md transition-shadow">
                  <div className="flex items-start justify-between mb-1">
                    <div className="text-sm font-medium text-gray-900 line-clamp-1">{title}</div>
                    {status ? (
                      <span className={`ml-2 px-2 py-0.5 text-[10px] font-medium rounded ${getStatusClasses(status)}`}>
                        {getStatusLabel(status)}
                      </span>
                    ) : null}
                  </div>
                  {desc ? <div className="text-xs text-gray-600 line-clamp-2">{desc}</div> : <div className="text-xs text-gray-400 italic">No description</div>}
                  {(topic || idea?.priority) ? (
                    <div className="text-xs text-gray-500 mt-2">
                      {topic ? <span>Topic: {topic}</span> : null}
                      {idea?.priority ? <span className="ml-2">Priority: {String(idea.priority)}</span> : null}
                    </div>
                  ) : null}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="p-4 bg-gray-50 rounded-lg border border-dashed border-gray-300 text-center">
            <div className="text-sm text-gray-600">No backlog ideas to display</div>
          </div>
        )}
      </div>
    </div>
  );
};

    // Component registry
    const ComponentRegistry = {
      NewsletterCalendarBoard: NewsletterCalendarBoard
    };

    // Component renderer
    const ComponentRenderer = ({ componentName, props }) => {
      const Component = ComponentRegistry[componentName];

      if (!Component) {
        return (
          <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p className="text-sm text-yellow-800">Component "{componentName}" not found</p>
          </div>
        );
      }

      return <Component {...props} />;
    };

    // Content chunk renderer
    const ContentChunkRenderer = ({ chunk }) => {
      if (chunk.type === 'text') {
        return <div className="text-gray-800 whitespace-pre-wrap">{chunk.text}</div>;
      } else if (chunk.type === 'component') {
        const { name, props } = chunk.component;
        return (
          <div className="my-4">
            <ComponentRenderer componentName={name} props={props} />
          </div>
        );
      }
      return null;
    };

    // Message bubble
    const MessageBubble = ({ message }) => {
      const role = message.role;
      const content = message.content;

      if (role === 'user') {
        return (
          <div className="flex justify-end mb-4">
            <div className="bg-blue-500 text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-2xl">
              {content}
            </div>
          </div>
        );
      } else if (role === 'assistant') {
        return (
          <div className="flex justify-start mb-4">
            <div className="bg-white rounded-2xl rounded-tl-sm px-4 py-3 max-w-4xl shadow-sm">
              {Array.isArray(content) ? (
                <div className="space-y-3">
                  {content.map((chunk, idx) => (
                    <ContentChunkRenderer key={idx} chunk={chunk} />
                  ))}
                </div>
              ) : (
                <div className="text-gray-800">{content}</div>
              )}
            </div>
          </div>
        );
      } else if (role === 'tool') {
        return (
          <div className="flex justify-center mb-4">
            <div className="bg-gray-100 text-gray-700 rounded-lg px-3 py-2 text-sm max-w-2xl">
              <div className="font-medium text-gray-500 text-xs mb-1">Tool Response</div>
              <div className="font-mono text-xs">{content}</div>
            </div>
          </div>
        );
      }

      return null;
    };

    // Conversation view
    const ConversationView = ({ conversation }) => {
      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8">
          <div className="max-w-5xl mx-auto px-4">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <h1 className="text-2xl font-bold text-gray-900 mb-6">Plan my next 6 weeks of newsletter issues with topics, CTAs, and draft status.</h1>
              <div className="space-y-2">
                {conversation.map((msg, idx) => (
                  <MessageBubble key={idx} message={msg} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render to DOM
    const rootEl = document.getElementById("root");
    if (rootEl) {
      const root = createRoot(rootEl);
      root.render(<ConversationView conversation={conversationData} />);
    }
  </script>
</body>
</html>
