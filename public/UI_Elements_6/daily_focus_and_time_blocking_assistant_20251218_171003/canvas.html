    // Component implementations
    // TimeBlockPlannerGrid
const TimeBlockPlannerGrid = (props) => {
  const {
    date,
    timezone,
    workingHours = {},
    calendarEvents = [],
    taskBlocks = [],
    dailyGoal = {},
    summary = {},
    conflictSummary = {},
    timeScale = {},
    displayFlags = {},
    colors = {}
  } = props;

  const palette = {
    bg: 'bg-white',
    border: 'border-gray-200',
    primary: 'text-blue-600',
    eventBg: colors.eventBg || 'bg-blue-50',
    eventText: colors.eventText || 'text-blue-800',
    taskBg: colors.taskBg || 'bg-green-50',
    taskText: colors.taskText || 'text-green-800',
    conflictBg: colors.conflictBg || 'bg-red-50',
    conflictText: colors.conflictText || 'text-red-700',
    neutralText: 'text-gray-600',
    neutralMuted: 'text-gray-500',
  };

  const fmtDate = (d) => {
    if (!d) return '';
    try {
      const dt = new Date(d);
      if (isNaN(dt.getTime())) return String(d);
      return dt.toLocaleDateString(undefined, {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        timeZone: timezone || undefined
      });
    } catch (e) {
      return String(d);
    }
  };

  const parseTimeHM = (hm) => {
    if (!hm || typeof hm !== 'string') return null;
    const parts = hm.split(':');
    if (parts.length < 2) return null;
    const h = Number(parts[0]);
    const m = Number(parts[1]);
    if (isNaN(h) || isNaN(m)) return null;
    return { h, m };
  };

  const buildDateAtHM = (baseDate, hm) => {
    const d = new Date(baseDate || new Date());
    const { h, m } = hm;
    d.setHours(h || 0, m || 0, 0, 0);
    return d;
  };

  const tryParseDate = (val, baseDate) => {
    if (!val) return null;
    if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
    if (typeof val === 'number') {
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }
    if (typeof val === 'string') {
      // If looks like "HH:MM", combine with base date
      const hm = parseTimeHM(val);
      if (hm) {
        return buildDateAtHM(baseDate || new Date(), hm);
      }
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }
    return null;
  };

  const timeOpts = {
    start: workingHours.start || '09:00',
    end: workingHours.end || '17:00',
    intervalMinutes: Number(timeScale.intervalMinutes) || 30
  };

  const dayDate = useMemo(() => {
    if (!date) return new Date();
    const d = new Date(date);
    return isNaN(d.getTime()) ? new Date() : d;
  }, [date]);

  const dayRange = useMemo(() => {
    const startHM = parseTimeHM(timeOpts.start) || { h: 9, m: 0 };
    const endHM = parseTimeHM(timeOpts.end) || { h: 17, m: 0 };
    const start = buildDateAtHM(dayDate, startHM);
    const end = buildDateAtHM(dayDate, endHM);
    return { start, end };
  }, [dayDate, timeOpts.start, timeOpts.end]);

  const slots = useMemo(() => {
    const arr = [];
    const interval = timeOpts.intervalMinutes;
    const start = new Date(dayRange.start);
    const end = new Date(dayRange.end);
    if (isNaN(start.getTime()) || isNaN(end.getTime()) || interval <= 0) return arr;
    let cur = new Date(start);
    while (cur < end) {
      const next = new Date(cur.getTime() + interval * 60000);
      arr.push({ start: new Date(cur), end: next });
      cur = next;
    }
    return arr;
  }, [dayRange.start, dayRange.end, timeOpts.intervalMinutes]);

  const normalizedEvents = useMemo(() => {
    if (!Array.isArray(calendarEvents)) return [];
    return calendarEvents.map((e, idx) => {
      const s = tryParseDate(e.start || e.startTime, dayDate);
      const en = tryParseDate(e.end || e.endTime, dayDate);
      const title = e.title || e.name || `Event ${idx + 1}`;
      const loc = e.location || '';
      return {
        ...e,
        startDate: s,
        endDate: en,
        title,
        location: loc
      };
    }).filter(e => e.startDate && e.endDate);
  }, [calendarEvents, dayDate]);

  const normalizedTasks = useMemo(() => {
    if (!Array.isArray(taskBlocks)) return [];
    return taskBlocks.map((t, idx) => {
      const s = tryParseDate(t.start || t.startTime, dayDate);
      const en = tryParseDate(t.end || t.endTime, dayDate);
      const title = t.title || t.name || `Task ${idx + 1}`;
      const project = t.project || t.category || '';
      return {
        ...t,
        startDate: s,
        endDate: en,
        title,
        project
      };
    }).filter(t => t.startDate && t.endDate);
  }, [taskBlocks, dayDate]);

  const overlaps = (aStart, aEnd, bStart, bEnd) => {
    if (!aStart || !aEnd || !bStart || !bEnd) return false;
    return aStart < bEnd && aEnd > bStart;
  };

  const totalDurationHours = (items) => {
    if (!Array.isArray(items)) return 0;
    const sumMs = items.reduce((acc, it) => {
      const s = it.startDate;
      const e = it.endDate;
      if (!s || !e) return acc;
      const ms = e.getTime() - s.getTime();
      return acc + (ms > 0 ? ms : 0);
    }, 0);
    const hours = sumMs / 3600000;
    return isNaN(hours) ? 0 : hours;
    };

  const eventsBySlot = useMemo(() => {
    return slots.map(slot => {
      const evs = normalizedEvents.filter(e => overlaps(e.startDate, e.endDate, slot.start, slot.end));
      return evs;
    });
  }, [slots, normalizedEvents]);

  const tasksBySlot = useMemo(() => {
    return slots.map(slot => {
      const tks = normalizedTasks.filter(t => overlaps(t.startDate, t.endDate, slot.start, slot.end));
      return tks;
    });
  }, [slots, normalizedTasks]);

  const fmtTime = (d) => {
    if (!d) return '';
    try {
      return d.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: timezone || undefined
      });
    } catch (e) {
      return '';
    }
  };

  const goalTarget = Number(dailyGoal.target || dailyGoal.minutes || 0);
  const goalUnit = dailyGoal.unit || (dailyGoal.minutes ? 'min' : 'hrs');
  const goalText = dailyGoal.text || dailyGoal.description || '';
  const totalEventHrs = totalDurationHours(normalizedEvents);
  const totalTaskHrs = totalDurationHours(normalizedTasks);
  const goalProgress = (() => {
    if (goalTarget <= 0) return null;
    const totalMinutes = Math.round(totalTaskHrs * 60);
    const targetMinutes = dailyGoal.minutes ? Number(dailyGoal.minutes) : Math.round(goalTarget * (goalUnit === 'min' ? 1 : 60));
    const pct = targetMinutes > 0 ? Math.min(100, Math.round((totalMinutes / targetMinutes) * 100)) : 0;
    return { totalMinutes, targetMinutes, pct };
  })();

  const conflictCount = Number(conflictSummary.count || conflictSummary.total || 0);
  const timeLabel = fmtDate(dayDate);

  return (
    <div className={`w-full max-w-2xl mx-auto ${palette.bg} rounded-lg shadow-sm border ${palette.border} p-4 relative hover:shadow-md transition-shadow`}>
      <div className="flex items-start justify-between mb-4">
        <div>
          <div className="text-lg font-semibold text-gray-900">{timeLabel || 'Schedule'}</div>
          <div className="text-sm text-gray-500">
            {timezone ? `Time zone: ${timezone}` : 'Local time'}
          </div>
        </div>
        <div className="flex items-center gap-2">
          {goalProgress ? (
            <span className="px-2 py-1 text-xs font-medium bg-green-100 text-green-700 rounded">
              Goal {goalProgress.pct}% ({goalProgress.totalMinutes}/{goalProgress.targetMinutes} min)
            </span>
          ) : dailyGoal && (dailyGoal.target || goalText) ? (
            <span className="px-2 py-1 text-xs font-medium bg-green-100 text-green-700 rounded">
              Goal set
            </span>
          ) : null}
          {conflictCount > 0 ? (
            <span className={`px-2 py-1 text-xs font-medium ${palette.conflictBg} ${palette.conflictText} rounded`}>
              {conflictCount} conflict{conflictCount === 1 ? '' : 's'}
            </span>
          ) : null}
        </div>
      </div>

      {(summary && (summary.note || summary.text)) ? (
        <div className="mb-4 p-3 bg-gray-50 border border-gray-200 rounded-md">
          <div className="text-sm text-gray-700">{summary.note || summary.text}</div>
        </div>
      ) : null}

      <div className="overflow-x-auto rounded-md border border-gray-200">
        <table className="min-w-full divide-y divide-gray-200">
          <thead className="bg-gray-50">
            <tr>
              <th className="px-3 py-2 text-left text-xs font-medium text-gray-600 uppercase tracking-wider w-28">Time</th>
              <th className="px-3 py-2 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Calendar</th>
              <th className="px-3 py-2 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Tasks</th>
            </tr>
          </thead>
          <tbody className="bg-white divide-y divide-gray-100">
            {Array.isArray(slots) && slots.length > 0 ? (
              slots.map((slot, idx) => {
                const evs = eventsBySlot[idx] || [];
                const tks = tasksBySlot[idx] || [];
                const timeStr = `${fmtTime(slot.start)} - ${fmtTime(slot.end)}`;
                return (
                  <tr key={idx} className="align-top">
                    <td className="px-3 py-3 text-sm text-gray-700 whitespace-nowrap">
                      <div className="font-medium">{fmtTime(slot.start)}</div>
                      <div className="text-xs text-gray-500">{timeStr}</div>
                    </td>
                    <td className="px-3 py-3">
                      {evs.length === 0 ? (
                        <div className="text-sm text-gray-400">No events</div>
                      ) : (
                        <div className="flex flex-col gap-2">
                          {evs.map((e, i) => {
                            const range = `${fmtTime(e.startDate)} - ${fmtTime(e.endDate)}`;
                            const meta = e.location ? ` • ${e.location}` : '';
                            return (
                              <div key={i} className={`p-2 ${palette.eventBg} ${palette.eventText} rounded-md border border-blue-100`}>
                                <div className="text-sm font-medium line-clamp-1">{e.title}</div>
                                <div className="text-xs opacity-80">
                                  {range}{meta}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </td>
                    <td className="px-3 py-3">
                      {tks.length === 0 ? (
                        <div className="text-sm text-gray-400">No tasks</div>
                      ) : (
                        <div className="flex flex-col gap-2">
                          {tks.map((t, i) => {
                            const range = `${fmtTime(t.startDate)} - ${fmtTime(t.endDate)}`;
                            const meta = t.project ? ` • ${t.project}` : '';
                            return (
                              <div key={i} className={`p-2 ${palette.taskBg} ${palette.taskText} rounded-md border border-green-100`}>
                                <div className="text-sm font-medium line-clamp-1">{t.title}</div>
                                <div className="text-xs opacity-80">
                                  {range}{meta}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })
            ) : (
              <tr>
                <td colSpan={3} className="px-3 py-6">
                  <div className="flex items-center justify-center text-sm text-gray-500">
                    No time slots to display
                  </div>
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>

      <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div className="p-3 bg-gray-50 rounded-md border border-gray-200">
          <div className="flex items-center justify-between">
            <span className="text-sm font-medium text-gray-700">Events</span>
            <span className="px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-700 rounded">
              {Array.isArray(normalizedEvents) ? normalizedEvents.length : 0}
            </span>
          </div>
          <div className="mt-1 text-lg font-semibold text-gray-900">
            {totalEventHrs.toFixed(1)}h
          </div>
          <div className="text-xs text-gray-500 mt-0.5">Total scheduled</div>
        </div>

        <div className="p-3 bg-gray-50 rounded-md border border-gray-200">
          <div className="flex items-center justify-between">
            <span className="text-sm font-medium text-gray-700">Tasks</span>
            <span className="px-2 py-0.5 text-xs font-medium bg-green-100 text-green-700 rounded">
              {Array.isArray(normalizedTasks) ? normalizedTasks.length : 0}
            </span>
          </div>
          <div className="mt-1 text-lg font-semibold text-gray-900">
            {totalTaskHrs.toFixed(1)}h
          </div>
          <div className="text-xs text-gray-500 mt-0.5">Total focused</div>
        </div>

        <div className="p-3 bg-gray-50 rounded-md border border-gray-200">
          <div className="flex items-center justify-between">
            <span className="text-sm font-medium text-gray-700">Daily Goal</span>
            <span className="px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-700 rounded">
              {goalTarget ? `${goalTarget}${goalUnit === 'min' ? 'm' : 'h'}` : '—'}
            </span>
          </div>
          <div className="mt-1 text-lg font-semibold text-gray-900">
            {goalProgress ? `${goalProgress.pct}%` : 'Not set'}
          </div>
          <div className="text-xs text-gray-500 mt-0.5">{goalText || 'Plan your focus time'}</div>
        </div>
      </div>

      {displayFlags && displayFlags.showConflicts && conflictCount > 0 ? (
        <div className={`mt-4 p-3 ${palette.conflictBg} rounded-md border border-red-200`}>
          <div className={`text-sm ${palette.conflictText} font-medium`}>
            Conflicts detected
          </div>
          <div className="text-xs text-red-600 mt-1">
            {conflictSummary.details || 'Some events or tasks overlap within the same time slots.'}
          </div>
        </div>
      ) : null}
    </div>
  );
};

// ConflictWarningsPanel
const ConflictWarningsPanel = (props) => {
  const {
    title,
    timeframe = {},
    generatedAt,
    totalConflicts,
    severitySummary = {},
    conflicts = [],
    showSeverityLegend = true,
    showOverlapDurations = true,
    colorsBySeverity = {},
    iconUrl
  } = props;

  const safeTotal = typeof totalConflicts === 'number' ? totalConflicts : (Array.isArray(conflicts) ? conflicts.length : 0);

  const defaultSeverityColors = {
    low: { bg: 'bg-green-100', text: 'text-green-700', dot: 'bg-green-500', ring: 'ring-green-200' },
    medium: { bg: 'bg-yellow-100', text: 'text-yellow-800', dot: 'bg-yellow-500', ring: 'ring-yellow-200' },
    high: { bg: 'bg-red-100', text: 'text-red-700', dot: 'bg-red-500', ring: 'ring-red-200' },
    critical: { bg: 'bg-purple-100', text: 'text-purple-700', dot: 'bg-purple-500', ring: 'ring-purple-200' },
    unknown: { bg: 'bg-gray-100', text: 'text-gray-700', dot: 'bg-gray-400', ring: 'ring-gray-200' }
  };

  const getSeverityKey = (s) => {
    const val = (s || '').toString().toLowerCase();
    if (val === 'low' || val === 'medium' || val === 'high' || val === 'critical') {
      return val;
    }
    return 'unknown';
  };

  const severityStyles = (sev) => {
    const key = getSeverityKey(sev);
    const override = colorsBySeverity && colorsBySeverity[key] ? colorsBySeverity[key] : null;
    if (override && typeof override === 'object') {
      return {
        bg: override.bg || defaultSeverityColors[key].bg,
        text: override.text || defaultSeverityColors[key].text,
        dot: override.dot || defaultSeverityColors[key].dot,
        ring: override.ring || defaultSeverityColors[key].ring
      };
    }
    return defaultSeverityColors[key];
  };

  const readableDate = (d) => {
    if (!d) return null;
    const dt = new Date(d);
    return isNaN(dt.getTime()) ? null : dt.toLocaleString();
  };

  const timeWindowLabel = (tf) => {
    if (!tf || typeof tf !== 'object') return null;
    const start = tf.start || tf.from || tf.begin || null;
    const end = tf.end || tf.to || tf.finish || null;
    const startStr = start ? readableDate(start) : null;
    const endStr = end ? readableDate(end) : null;
    if (startStr && endStr) return startStr + ' - ' + endStr;
    if (startStr) return 'From ' + startStr;
    if (endStr) return 'Until ' + endStr;
    return null;
  };

  const getDurationLabel = (c) => {
    const d = c && (c.overlapDuration || c.duration || c.minutes || c.seconds);
    if (typeof d === 'string') return d;
    if (typeof d === 'number' && !isNaN(d)) {
      const totalSec = Math.max(0, Math.floor(d));
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      if (hours > 0) return hours + 'h ' + (minutes > 0 ? minutes + 'm' : '');
      if (minutes > 0) return minutes + 'm ' + (seconds > 0 ? seconds + 's' : '');
      return seconds + 's';
    }
    if (c && c.overlapStart && c.overlapEnd) {
      const s = new Date(c.overlapStart);
      const e = new Date(c.overlapEnd);
      if (!isNaN(s.getTime()) && !isNaN(e.getTime())) {
        const secs = Math.max(0, Math.floor((e.getTime() - s.getTime()) / 1000));
        return getDurationLabel({ overlapDuration: secs });
      }
    }
    return null;
  };

  const getConflictWindow = (c) => {
    const start = c && (c.start || c.from || c.begin || c.windowStart);
    const end = c && (c.end || c.to || c.finish || c.windowEnd);
    const s = start ? readableDate(start) : null;
    const e = end ? readableDate(end) : null;
    if (s && e) return s + ' - ' + e;
    if (s) return 'From ' + s;
    if (e) return 'Until ' + e;
    return null;
  };

  const getConflictTitle = (c) => {
    return c && (c.title || c.name || c.summary || c.id || 'Conflict');
  };

  const getConflictDescription = (c) => {
    return c && (c.description || c.details || c.note || '');
  };

  const getResources = (c) => {
    const res = c && (c.resources || c.parties || c.entities || c.actors);
    if (Array.isArray(res)) return res;
    if (typeof res === 'string') return [res];
    return [];
  };

  const computedSevCounts = (() => {
    const counts = { low: 0, medium: 0, high: 0, critical: 0, unknown: 0 };
    if (severitySummary && typeof severitySummary === 'object') {
      Object.keys(severitySummary).forEach((k) => {
        const key = getSeverityKey(k);
        const val = Number(severitySummary[k]);
        counts[key] = isNaN(val) ? counts[key] : val;
      });
    } else if (Array.isArray(conflicts)) {
      conflicts.forEach((c) => {
        const key = getSeverityKey(c && c.severity);
        counts[key] = (counts[key] || 0) + 1;
      });
    }
    return counts;
  })();

  const timeframeLabel = timeWindowLabel(timeframe);
  const generatedAtLabel = readableDate(generatedAt);

  return (
    <div className="w-full max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6 border border-gray-200">
      <div className="flex items-start gap-3 mb-4">
        <div className="flex-shrink-0">
          {iconUrl ? (
            <img
              src={iconUrl}
              alt="Warnings icon"
              loading="lazy"
              className="w-10 h-10 rounded-md object-cover ring-1 ring-gray-200"
            />
          ) : (
            <div className="w-10 h-10 rounded-md bg-blue-50 flex items-center justify-center ring-1 ring-blue-100">
              <span className="text-blue-600 text-xl">⚠️</span>
            </div>
          )}
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between">
            <h3 className="text-lg font-semibold text-gray-900">{title || 'Conflict warnings'}</h3>
            <span className="px-2.5 py-1 text-xs font-medium bg-blue-50 text-blue-700 rounded-full ring-1 ring-blue-100">
              {safeTotal.toLocaleString()} total
            </span>
          </div>
          {(timeframeLabel || generatedAtLabel) ? (
            <div className="mt-1 text-xs text-gray-500">
              {timeframeLabel ? <span>Timeframe: {timeframeLabel}</span> : null}
              {timeframeLabel && generatedAtLabel ? <span> • </span> : null}
              {generatedAtLabel ? <span>Generated: {generatedAtLabel}</span> : null}
            </div>
          ) : null}
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        {['low', 'medium', 'high', 'critical'].map((k) => {
          const styles = severityStyles(k);
          const count = computedSevCounts[k] || 0;
          return (
            <div key={k} className={`p-3 ${styles.bg} rounded-md ring-1 ${styles.ring}`}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className={`inline-block w-2.5 h-2.5 rounded-full ${styles.dot}`}></span>
                  <span className={`text-xs uppercase tracking-wide ${styles.text}`}>{k}</span>
                </div>
                <span className={`text-sm font-semibold ${styles.text}`}>{count.toLocaleString()}</span>
              </div>
            </div>
          );
        })}
      </div>

      {showSeverityLegend ? (
        <div className="mb-4 p-3 bg-gray-50 rounded-md border border-gray-200">
          <div className="text-xs text-gray-600">
            Severity legend:
            <span className="ml-2 mr-3"><span className="inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span>Low</span>
            <span className="mr-3"><span className="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-1"></span>Medium</span>
            <span className="mr-3"><span className="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span>High</span>
            <span className="mr-0"><span className="inline-block w-2 h-2 rounded-full bg-purple-500 mr-1"></span>Critical</span>
          </div>
        </div>
      ) : null}

      {!Array.isArray(conflicts) || conflicts.length === 0 ? (
        <div className="p-6 bg-gray-50 rounded-lg border border-dashed border-gray-300 text-center">
          <div className="text-2xl mb-2">🕊️</div>
          <div className="text-sm text-gray-700 font-medium">No conflicts to display</div>
          <div className="text-xs text-gray-500 mt-1">Your timeframe {timeframeLabel ? '(' + timeframeLabel + ')' : ''} has no detected overlaps.</div>
        </div>
      ) : (
        <div className="overflow-hidden rounded-lg border border-gray-200">
          <div className="overflow-x-auto">
            <table className="min-w-full divide-y divide-gray-200">
              <thead className="bg-gray-50">
                <tr>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">Conflict</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">Resources</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">Time Window</th>
                  {showOverlapDurations ? (
                    <th className="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">Overlap</th>
                  ) : null}
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">Severity</th>
                </tr>
              </thead>
              <tbody className="bg-white divide-y divide-gray-100">
                {conflicts.map((c, index) => {
                  const sevKey = getSeverityKey(c && c.severity);
                  const styles = severityStyles(sevKey);
                  const titleText = getConflictTitle(c);
                  const descText = getConflictDescription(c);
                  const resources = getResources(c);
                  const windowText = getConflictWindow(c);
                  const overlapText = getDurationLabel(c);
                  return (
                    <tr key={index} className="hover:bg-gray-50 transition-colors">
                      <td className="px-4 py-3 align-top">
                        <div className="flex items-start gap-2">
                          <span className={`mt-1 inline-block w-2.5 h-2.5 rounded-full ${styles.dot}`}></span>
                          <div>
                            <div className="text-sm font-medium text-gray-900 line-clamp-1">{titleText}</div>
                            {descText ? (
                              <div className="text-xs text-gray-500 mt-0.5 line-clamp-2">{descText}</div>
                            ) : null}
                          </div>
                        </div>
                      </td>
                      <td className="px-4 py-3 align-top">
                        {resources.length > 0 ? (
                          <div className="flex flex-wrap gap-1">
                            {resources.slice(0, 4).map((r, i) => (
                              <span key={i} className="px-2 py-0.5 text-xs bg-gray-100 text-gray-700 rounded-md ring-1 ring-gray-200">
                                {typeof r === 'string' ? r : JSON.stringify(r)}
                              </span>
                            ))}
                            {resources.length > 4 ? (
                              <span className="px-2 py-0.5 text-xs bg-gray-50 text-gray-500 rounded-md ring-1 ring-gray-100">
                                +{(resources.length - 4).toLocaleString()} more
                              </span>
                            ) : null}
                          </div>
                        ) : (
                          <span className="text-xs text-gray-400">No resources</span>
                        )}
                      </td>
                      <td className="px-4 py-3 align-top">
                        <div className="text-xs text-gray-700">{windowText || '—'}</div>
                      </td>
                      {showOverlapDurations ? (
                        <td className="px-4 py-3 align-top">
                          <div className="text-xs text-gray-700">{overlapText || '—'}</div>
                        </td>
                      ) : null}
                      <td className="px-4 py-3 align-top">
                        <span className={`inline-flex items-center gap-1.5 px-2 py-1 text-xs font-medium rounded-full ${styles.bg} ${styles.text} ring-1 ${styles.ring}`}>
                          <span className={`inline-block w-2 h-2 rounded-full ${styles.dot}`}></span>
                          {sevKey.charAt(0).toUpperCase() + sevKey.slice(1)}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {Array.isArray(conflicts) && conflicts.length > 0 ? (
        <div className="mt-4 text-xs text-gray-500">
          Displaying {conflicts.length.toLocaleString()} of {safeTotal.toLocaleString()} conflicts
        </div>
      ) : null}
    </div>
  );
};

    // Component registry
    const ComponentRegistry = {
      ConflictWarningsPanel: ConflictWarningsPanel,
      TimeBlockPlannerGrid: TimeBlockPlannerGrid
    };

    // Component renderer
    const ComponentRenderer = ({ componentName, props }) => {
      const Component = ComponentRegistry[componentName];

      if (!Component) {
        return (
          <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p className="text-sm text-yellow-800">Component "{componentName}" not found</p>
          </div>
        );
      }

      return <Component {...props} />;
    };

    // Content chunk renderer
    const ContentChunkRenderer = ({ chunk }) => {
      if (chunk.type === 'text') {
        return <div className="text-gray-800 whitespace-pre-wrap">{chunk.text}</div>;
      } else if (chunk.type === 'component') {
        const { name, props } = chunk.component;
        return (
          <div className="my-4">
            <ComponentRenderer componentName={name} props={props} />
          </div>
        );
      }
      return null;
    };

    // Message bubble
    const MessageBubble = ({ message }) => {
      const role = message.role;
      const content = message.content;

      if (role === 'user') {
        return (
          <div className="flex justify-end mb-4">
            <div className="bg-blue-500 text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-2xl">
              {content}
            </div>
          </div>
        );
      } else if (role === 'assistant') {
        return (
          <div className="flex justify-start mb-4">
            <div className="bg-white rounded-2xl rounded-tl-sm px-4 py-3 max-w-4xl shadow-sm">
              {Array.isArray(content) ? (
                <div className="space-y-3">
                  {content.map((chunk, idx) => (
                    <ContentChunkRenderer key={idx} chunk={chunk} />
                  ))}
                </div>
              ) : (
                <div className="text-gray-800">{content}</div>
              )}
            </div>
          </div>
        );
      } else if (role === 'tool') {
        return (
          <div className="flex justify-center mb-4">
            <div className="bg-gray-100 text-gray-700 rounded-lg px-3 py-2 text-sm max-w-2xl">
              <div className="font-medium text-gray-500 text-xs mb-1">Tool Response</div>
              <div className="font-mono text-xs">{content}</div>
            </div>
          </div>
        );
      }

      return null;
    };

    // Conversation view
    const ConversationView = ({ conversation }) => {
      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8">
          <div className="max-w-5xl mx-auto px-4">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <h1 className="text-2xl font-bold text-gray-900 mb-6">Turn my to-do list into a time-blocked schedule around my existing calendar events.</h1>
              <div className="space-y-2">
                {conversation.map((msg, idx) => (
                  <MessageBubble key={idx} message={msg} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render to DOM
    const rootEl = document.getElementById("root");
    if (rootEl) {
      const root = createRoot(rootEl);
      root.render(<ConversationView conversation={conversationData} />);
    }
  </script>
</body>
</html>
