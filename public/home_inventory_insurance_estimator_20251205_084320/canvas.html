      try {

          style: 'currency',
          currency,
          maximumFractionDigits: 0

        return `${currency} ${Math.round(value).toLocaleString()}`;
      }
    };

    const parseCurrencyish = (text) => {

    const CategoryValuePieChart = (props) => {
      const {
        categoryNames = [],
        totalValues = [],
        insuredValues = [],
        currency = 'USD',
        highlightedIndex = -1
      } = props;

      const data = useMemo(() => {
        const items = categoryNames.map((name, i) => {
          const total = parseFloat(totalValues[i] ?? 0);
          const insured = parseFloat(insuredValues[i] ?? 0);
          const ratio = total > 0 ? insured / total : 0;
          return { name, total, insured, ratio, color: palette[i % palette.length] };
        }).filter(d => d.total > 0);
        const totalSum = items.reduce((a, b) => a + b.total, 0);
        return { items, totalSum };
      }, [categoryNames, totalValues, insuredValues]);

      const size = 220;
      const cx = size / 2;
      const cy = size / 2;
      const outerR = 100;
      const strokeW = 26;

      const describeArc = (cx, cy, r, startAngle, endAngle) => {
        const rad = Math.PI / 180;
        const sx = cx + r * Math.cos((startAngle - 90) * rad);
        const sy = cy + r * Math.sin((startAngle - 90) * rad);
        const ex = cx + r * Math.cos((endAngle - 90) * rad);
        const ey = cy + r * Math.sin((endAngle - 90) * rad);
        const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
        return `M ${sx} ${sy} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}`;
      };

      let angleStart = 0;
      const arcs = [];
      data.items.forEach((d, i) => {
        const fraction = data.totalSum > 0 ? d.total / data.totalSum : 0;
        const angle = fraction * 360;
        const angleEnd = angleStart + angle;
        arcs.push({
          path: describeArc(cx, cy, outerR, angleStart, angleEnd),
          color: d.color,
          index: i,
          value: d.total,
          name: d.name,
          fraction
        });
        angleStart = angleEnd;
      });

      return (
        <div className="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-lg font-semibold text-gray-900">Category Value Pie</h3>

              <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="Category distribution donut chart">
                <circle cx={cx} cy={cy} r={outerR} fill="#ffffff" />
                {arcs.map((a, i) => (
                  <path
                    key={i}
                    d={a.path}
                    stroke={a.color}
                    strokeWidth={strokeW}
                    fill="none"
                    opacity={highlightedIndex === a.index || highlightedIndex === -1 ? 0.95 : 0.35}
                    strokeLinecap="butt"
                  />
                ))}
                {/* Inner white circle to create donut */}
                <circle cx={cx} cy={cy} r={outerR - strokeW} fill="white" />
                <text x={cx} y={cy - 6} textAnchor="middle" className="fill-gray-600" style={{ fontSize: 12 }}>Coverage</text>
                <text x={cx} y={cy + 12} textAnchor="middle" className="fill-gray-900" style={{ fontSize: 18, fontWeight: 700 }}>
                  {data.totalSum ? `${Math.round((insuredValues.reduce((a, b) => a + (b || 0), 0) / data.totalSum) * 100)}%` : '-'}
                </text>
              </svg>
            </div>
            <div className="space-y-3">
              {data.items.map((d, i) => {
                const current = d.insured;
                const barPct = d.total > 0 ? clamp((current / d.total) * 100, 0, 100) : 0;
                return (
                  <div key={i} className="border border-gray-100 rounded-lg p-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="inline-block w-3 h-3 rounded" style={{ backgroundColor: d.color }} />

                      <div className="text-sm text-gray-600">{formatCurrency(d.total, currency)}</div>

                        <div className="h-2 bg-indigo-600" style={{ width: `${barPct}%` }} />

                      <div className="mt-1 text-xs text-gray-600 flex items-center justify-between">
                        <span>Insured: {formatCurrency(current, currency)}</span>
                        <span className={barPct < 100 ? "text-rose-600" : "text-emerald-600"}>{Math.round(barPct)}%</span>
                      </div>
                    </div>
                  </div>
                );
              })}
              {data.items.length === 0 && (
                <div className="text-sm text-gray-500">No category data provided.</div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const HighValueItemTable = (props) => {

          const parts = String(line).split('|').map(p => p.trim());
          // Expected: name | category | replacement | insured | gap | underinsured?
          const name = parts[0] ?? `Item ${idx + 1}`;
          const category = parts[1] ?? '';
          const replacement = parseCurrencyish(parts[2] ?? 0);
          const insured = parseCurrencyish(parts[3] ?? 0);
          const gap = parseCurrencyish(parts[4] ?? (replacement - insured));
          const under = (parts[5] ?? '').toString().toLowerCase().startsWith('y') || gap > 0;
          return { name, category, replacement, insured, gap, under };
        });
        return parsed;
      }, [lines]);

      const filteredSorted = useMemo(() => {
        let arr = rows.slice();
        if (underOnly) arr = arr.filter(r => r.under && r.gap > 0.0001);
        if (localSort === 'replacementCost') {
          arr.sort((a, b) => b.replacement - a.replacement);
        } else if (localSort === 'gap') {
          arr.sort((a, b) => b.gap - a.gap);
        }
        return arr;
      }, [rows, underOnly, localSort]);

      const totalReplacement = rows.reduce((a, b) => a + b.replacement, 0);
      const totalInsured = rows.reduce((a, b) => a + b.insured, 0);
      const totalGap = rows.reduce((a, b) => a + b.gap, 0);

      return (
        <div className="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

            <div className="flex items-center gap-3">
              <label className="text-sm text-gray-700">Sort by:</label>
              <select
                value={localSort}
                onChange={(e) => setLocalSort(e.target.value)}

                Underinsured only

                  <th className="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                  <th className="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Replacement</th>
                  <th className="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Insured</th>
                  <th className="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Gap</th>

                    <td className="px-4 py-2 text-sm text-right text-gray-900">{formatCurrency(r.insured, currency)}</td>
                    <td className={`px-4 py-2 text-sm text-right ${r.gap > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                      {formatCurrency(r.gap, currency)}

                      <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${r.under && r.gap > 0 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                        {r.under && r.gap > 0 ? 'Yes' : 'No'}

    const RiskRatingScorecard = (props) => {
      const {
        overallScore = 0,
        riskLevel = 'medium',
        driverLabels = [],
        driverImpacts = [],
        scoringMethodNote = ''
      } = props;

      const score = clamp(Math.round(overallScore), 0, 100);
      const rl = String(riskLevel || '').toLowerCase();
      const normalizedLevel =
        rl === 'low' || rl === 'medium' || rl === 'high' ? rl :
        rl.startsWith('mod') ? 'medium' :
        rl.startsWith('med') ? 'medium' : rl;

      const color = normalizedLevel === 'low' ? '#10b981' : normalizedLevel === 'high' ? '#ef4444' : '#f59e0b';
      const bgBadge = normalizedLevel === 'low' ? 'bg-emerald-50 text-emerald-700'
                    : normalizedLevel === 'high' ? 'bg-rose-50 text-rose-700'
                    : 'bg-amber-50 text-amber-700';

      const size = 140;
      const cx = size / 2, cy = size / 2, r = 60, strokeW = 14;
      const circumference = 2 * Math.PI * r;
      const progress = (score / 100) * circumference;

      const drivers = useMemo(() => {
        if (Array.isArray(driverLabels) && driverLabels.length && Array.isArray(driverImpacts) && driverImpacts.length) {
          return driverLabels.map((label, i) => {
            const d = driverImpacts[i];
            // Accept strings or objects
            if (typeof d === 'string') {
              return { label, detail: d };
            } else if (d && typeof d === 'object') {
              const impact = d.impact ?? d.level ?? '';
              const value = d.value ?? d.detail ?? '';
              return { label, detail: [impact, value].filter(Boolean).join(' — ') || '(no detail)' };
            }
            return { label, detail: '' };
          });
        }
        // Fallback: flatten driverImpacts if labels missing
        if (Array.isArray(driverImpacts)) {
          return driverImpacts.map((d, i) => {
            if (typeof d === 'string') return { label: `Driver ${i + 1}`, detail: d };
            if (d && typeof d === 'object') {
              const name = d.name ?? `Driver ${i + 1}`;
              const impact = d.impact ?? '';
              const value = d.value ?? '';
              return { label: name, detail: [impact, value].filter(Boolean).join(' — ') };
            }
            return { label: `Driver ${i + 1}`, detail: '' };
          });
        }
        return [];
      }, [driverLabels, driverImpacts]);

      return (
        <div className="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <div className="flex items-start gap-5">
            <div className="relative">
              <svg width={size} height={size}>

                  cx={cx}
                  cy={cy}
                  r={r}
                  stroke={color}
                  strokeWidth={strokeW}
                  fill="none"
                  strokeDasharray={`${progress} ${circumference - progress}`}
                  strokeLinecap="round"
                  transform={`rotate(-90 ${cx} ${cy})`}

              </svg>
              <div className={`absolute -bottom-2 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded-full text-xs font-medium ${bgBadge}`}>
                {normalizedLevel.charAt(0).toUpperCase() + normalizedLevel.slice(1)}
              </div>
            </div>
            <div className="flex-1">
              <h3 className="text-lg font-semibold text-gray-900">Risk Rating Scorecard</h3>
              <ul className="mt-3 space-y-2">
                {drivers.map((d, i) => (
                  <li key={i} className="flex items-start gap-2">
                    <span className="mt-1 w-1.5 h-1.5 rounded-full" style={{ backgroundColor: color }} />
                    <div>
                      <div className="text-sm font-medium text-gray-900">{d.label}</div>
                      <div className="text-sm text-gray-600">{d.detail}</div>
                    </div>
                  </li>
                ))}
                {drivers.length === 0 && (
                  <li className="text-sm text-gray-500">No driver details provided.</li>
                )}
              </ul>
              {scoringMethodNote && (
                <div className="mt-3 text-xs text-gray-500">{scoringMethodNote}</div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const CoverageEstimateCards = (props) => {
      const {
        labels = [],
        categories = [],
        suggestedLimits = [],
        shortfalls = [],
        currency = 'USD'
      } = props;

      const items = useMemo(() => {
        const len = Math.max(labels.length, suggestedLimits.length, shortfalls.length);
        const list = [];
        for (let i = 0; i < len; i++) {
          const label = labels[i] ?? `Category ${i + 1}`;
          const suggested = parseFloat(suggestedLimits[i] ?? 0);
          const shortfall = parseFloat(shortfalls[i] ?? 0);
          const current = Math.max(0, suggested - shortfall);
          const coveragePct = suggested > 0 ? clamp((current / suggested) * 100, 0, 100) : 0;
          list.push({
            label,
            suggested,
            shortfall,
            current,
            coveragePct,
            color: palette[i % palette.length]
          });
        }
        return list;
      }, [labels, suggestedLimits, shortfalls]);

      return (
        <div className="w-full bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h3 className="text-lg font-semibold text-gray-900 mb-4">Coverage Estimate Cards</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {items.map((it, i) => (
              <div key={i} className="border border-gray-100 rounded-lg p-4 hover:shadow-sm transition-shadow">
                <div className="flex items-center justify-between">
                  <div className="text-sm font-medium text-gray-900">{it.label}</div>
                  <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ backgroundColor: it.color }} />
                </div>
                <div className="mt-2 text-sm text-gray-600">Suggested limit</div>
                <div className="text-base font-semibold text-gray-900">{formatCurrency(it.suggested, currency)}</div>

                <div className="mt-3">
                  <div className="flex items-center justify-between text-xs text-gray-600">
                    <span>Current</span>
                    <span>{formatCurrency(it.current, currency)}</span>
                  </div>
                  <div className="h-2 w-full bg-gray-200 rounded-full mt-1 overflow-hidden">
                    <div className="h-2 bg-indigo-600" style={{ width: `${it.coveragePct}%` }} />
                  </div>
                </div>

                <div className="mt-3 flex items-center justify-between">
                  <div className="text-sm text-gray-600">Shortfall</div>
                  <div className="text-sm font-medium text-rose-600">{formatCurrency(it.shortfall, currency)}</div>
                </div>
              </div>
            ))}
            {items.length === 0 && (
              <div className="text-sm text-gray-500">No coverage estimates available.</div>
            )}
          </div>
        </div>
      );
    };

    // Registry
    const ComponentRegistry = {
      InventoryInsuranceOverview: InventoryInsuranceOverview,
      CategoryValuePieChart: CategoryValuePieChart,
      HighValueItemTable: HighValueItemTable,
      RiskRatingScorecard: RiskRatingScorecard,
      CoverageEstimateCards: CoverageEstimateCards
    };

    const ComponentRenderer = ({ componentName, props }) => {
      const Component = ComponentRegistry[componentName];
      if (!Component) {
        return (
          <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p className="text-sm text-yellow-800">Component "{componentName}" not found</p>
          </div>
        );
      }
      return <Component {...(props || {})} />;
    };

    // Message content rendering
    const ContentChunkRenderer = ({ chunk }) => {
      if (!chunk) return null;
      if (typeof chunk === 'string') {
        return <p className="whitespace-pre-wrap text-gray-900">{chunk}</p>;
      }
      if (chunk.type === 'text') {
        return <p className="whitespace-pre-wrap text-gray-900">{chunk.text || ''}</p>;
      }
      if (chunk.type === 'component' && chunk.component) {
        const { name, props } = chunk.component;
        return (
          <div className="mt-3">
            <ComponentRenderer componentName={name} props={props} />
          </div>
        );
      }
      // Fallback: render JSON
      return (
        <pre className="text-xs bg-gray-50 p-3 rounded border border-gray-200 overflow-auto">
{JSON.stringify(chunk, null, 2)}
        </pre>
      );
    };

    const Avatar = ({ role }) => {
      const base = "flex items-center justify-center w-8 h-8 rounded-full text-white text-sm font-semibold";
      if (role === 'user') return <div className={`${base} bg-indigo-600`}>U</div>;
      if (role === 'assistant') return <div className={`${base} bg-emerald-600`}>A</div>;
      if (role === 'tool') return <div className={`${base} bg-amber-600`}>T</div>;
      return <div className={`${base} bg-gray-600`}>S</div>;
    };

    const MessageBubble = ({ message }) => {
      const role = message.role || 'assistant';
      const alignment = role === 'user' ? 'items-end' : 'items-start';
      const bubbleBg = role === 'user' ? 'bg-indigo-600 text-white' : role === 'assistant' ? 'bg-white text-gray-900' : 'bg-gray-100 text-gray-800';
      const borderClass = role === 'assistant' ? 'border border-gray-200' : role === 'tool' ? 'border border-gray-200' : '';
      const content = message.content;

      const renderContent = () => {
        if (Array.isArray(content)) {
          return content.map((chunk, i) => <ContentChunkRenderer key={i} chunk={chunk} />);
        }
        if (typeof content === 'string') {
          return <ContentChunkRenderer chunk={{ type: 'text', text: content }} />;
        }
        return <ContentChunkRenderer chunk={content} />;
      };

      return (
        <div className={`w-full flex ${alignment} gap-3`}>
          <Avatar role={role} />
          <div className={`max-w-3xl w-full rounded-2xl px-4 py-3 ${bubbleBg} ${borderClass}`}>
            {renderContent()}
          </div>
        </div>
      );
    };

    const ConversationView = ({ conversation = [] }) => {
      return (
        <div className="min-h-screen">
          <header className="bg-white border-b border-gray-200 sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 py-4">
              <h1 className="text-xl font-semibold text-gray-900">Conversation Viewer</h1>
              <p className="text-sm text-gray-600">Visualizing UI component conversation for Home Inventory Insurance Estimator</p>
            </div>
          </header>
          <main className="max-w-6xl mx-auto px-4 py-6 space-y-6">
            {Array.isArray(conversation) && conversation.map((msg, idx) => (
              <MessageBubble key={idx} message={msg} />
            ))}
          </main>
          <footer className="py-6 text-center text-xs text-gray-500">
            Built with React, Babel, and Tailwind CSS
          </footer>
        </div>
      );
    };

    const rootEl = document.getElementById("root");
    if (rootEl) {
      const root = createRoot(rootEl);
      root.render(<ConversationView conversation={conversationData} />);
    }
  </script>
</body>
</html>
